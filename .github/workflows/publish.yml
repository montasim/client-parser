name: Publish client-parser

on:
  push:
    tags: ['client-parser-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'montasim/client-parser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:parser
      - name: Verify tag matches package version
        run: node -e "if ('client-parser-v' + require('./packages/client-parser/package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: pnpm --dir packages/client-parser publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
